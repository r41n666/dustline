## Settings file was created by plugin Dustline Miku Mod v1.0.0
## Plugin GUID: dustline.mikumod

[HitSound]

## 用自定义受击音效替换原版命中音效
# Setting type: Boolean
# Default value: true
Enabled = true

## 受击音效目录（位于插件 assets 下）
# Setting type: String
# Default value: hit_female
Folder = hit_female

## 受击音效音量倍率
# Setting type: Single
# Default value: 1
Volume = 1

[Model]

## 是否用Miku 模型替换 T/CT 身体模型
# Setting type: Boolean
# Default value: true
Enabled = true

## 两个阵营都使用带骨骼的 cat 模型（关闭时 T 用 cat、CT 用静态 miku.glb）
# Setting type: Boolean
# Default value: true
UseCatForBothTeams = true

## 按原角色骨架自动对齐模型身高（推荐开启，Scale 仅作粗调）
# Setting type: Boolean
# Default value: true
AutoAlignHeight = true

## 模型整体缩放（关闭自动对齐时生效；开启后作为基准值再按原角色身高修正）
# Setting type: Single
# Default value: 1.3
Scale = 1.3

## 模型朝向补偿（度）
# Setting type: Single
# Default value: 180
YawOffset = 180

## 静态模型（CT）自动缩放后的目标身高（米）
# Setting type: Single
# Default value: 1.72
StaticHeight = 1.72

## 静态模型（CT）高度跟随骨盆的比例
# Setting type: Single
# Default value: 1
StaticHeightFactor = 1

## 骨盆静置高度（米），用于缺少骨骼时的兜底
# Setting type: Single
# Default value: 0.95
PelvisRestHeight = 0.95

[ThirdPerson]

## 启用 V 键第一/第三人称切换
# Setting type: Boolean
# Default value: true
Enabled = true

## 切换第一/第三人称的按键
# Setting type: String
# Default value: V
ToggleKey = V

## 第三人称相机距离
# Setting type: Single
# Default value: 3
Distance = 2.4

## 第三人称相机抬高
# Setting type: Single
# Default value: 0.22
Height = 0.1

## 第三人称相机右肩偏移
# Setting type: Single
# Default value: 0.35
ShoulderOffset = 0.35

## 第三人称相机最近距离（贴墙时）
# Setting type: Single
# Default value: 0.45
MinDistance = 0.45

[Video]

## 第一人称视场角覆盖（-1 = 使用游戏设置，80~110）
# Setting type: Single
# Default value: -1
FovOverride = -1

